<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IvyKemmy ThriftHub</title>
  <style>
    :root { --bg: #faf4fb; --ink: #2e1030; --muted: #6e5a72; --brand: #6b1f6e; --accent: #843473; --gold: #c9973a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px 16px; }
    img { width: 112px; height: 112px; }
    h1 { font-size: 1.25rem; margin: 16px 0 4px; color: var(--brand); }
    .tag { font-style: italic; color: var(--accent); margin: 0 0 20px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 1rem; font-weight: 600; }
    button:active { background: #4a0b4c; }
    a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .contact { margin-top: 24px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="IvyKemmy ThriftHub logo" />
    <h1>IvyKemmy ThriftHub</h1>
    <p class="tag">Quality Finds, Great Vibes</p>
    <p>We can't reach the shop right now.<br />Check your data or Wi-Fi and try again.</p>
    <button type="button" onclick="location.href='https://ivykemmy-thrifthub.vercel.app/'">Try again</button>
    <p class="contact">Need help? <a href="tel:+254741962189">Call 0741 962 189</a></p>
  </main>
</body>
</html>
